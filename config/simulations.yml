schema_version: 1
seed: 20260914
calibration_replicates: 250
held_out_replicates: null
sample_size: 8
family_size: 15
confidence_level: 0.95

# Effects are population changes in the median. These simulations exercise the
# exact pinned implementation under known generators; they are not application
# or host validation.
scenarios:
  duration_lognormal_low_noise:
    metric: duration
    distribution: lognormal
    baseline_median: 200000000
    coefficient_of_variation: 0.05
    warning_percent: 5
    failure_percent: 10
    minimum_absolute: 10000000
    effect_percent: [-20, 0, 5, 10, 15, 20]

  duration_lognormal_moderate_noise:
    metric: duration
    distribution: lognormal
    baseline_median: 200000000
    coefficient_of_variation: 0.15
    warning_percent: 5
    failure_percent: 10
    minimum_absolute: 10000000
    effect_percent: [-20, 0, 5, 10, 15, 20]

  allocations_lognormal_low_noise:
    metric: allocations
    distribution: lognormal
    baseline_median: 50000
    coefficient_of_variation: 0.05
    warning_percent: 10
    failure_percent: 20
    minimum_absolute: 0
    effect_percent: [-20, 0, 10, 20, 30, 40]
