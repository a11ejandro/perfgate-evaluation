schema_version: 1

study:
  id: perfgate-micropost-calibration-v1
  title: Perfgate Micropost calibration
  status: calibration
  subject_repository: ../perfgate-micropost
  subject_repository_url: https://github.com/a11ejandro/perfgate-micropost.git
  perfgate_repository: ../perfgate
  reference_ref: main
  perfgate_config: perfgate.yml
  workload_sources:
    - spec/perfgate/workloads_spec.rb
    - spec/support/workload_fixtures.rb
  conditions: config/conditions.yml
  randomization_seed: 20260914
  environment_class: ubuntu-24.04-postgresql-17-ruby-3.3.4
  reference_design: historical_stored_baseline
  estimator: independent_nonparametric_bootstrap_median_difference
  evidence_outcomes: [pass, warn, fail, inconclusive, incomparable]

calibration:
  aa_repetitions: 30
  injection_repetitions: 12
  minimum_distinct_days: 3
  minimum_worker_instances: 3

held_out:
  ready: false
  calibration_artifact: null
  calibration_artifact_digest: null
  aa_repetitions: null
  injection_repetitions: null
  minimum_distinct_days: null
  minimum_worker_instances: null
  acceptance:
    maximum_false_fail_rate: null
    maximum_warn_rate: null
    maximum_incomplete_evidence_rate: null
    maximum_reversal_rate: null
    minimum_interval_coverage: null
    minimum_detection_rate_by_condition: null
    maximum_cross_worker_instability: null
    maximum_median_comparison_seconds: null

analysis:
  study_rate_interval: wilson
  confidence_level: 0.95
  reversal_pairing: consecutive_disjoint_repetitions
  count_policy_result_as_evidence: false
  pool_calibration_with_held_out: false
